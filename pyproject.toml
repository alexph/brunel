[project]
name = "brunel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "openai-codex>=0.144.4",
    "platformdirs>=4.9.6",
    "prompt-toolkit>=3.0.52",
    "pydantic-ai-slim[ag-ui,openai]>=2.57.0",
    "pydantic-settings>=2.14.0",
    "pytest>=9.0.3",
    "alembic>=1.18.3",
    "sqlalchemy>=2.0.52",
    "typer>=0.24.1",
    "uvicorn>=0.52.3",
    "textual>=8.2.8",
    "httpx>=0.28.1",
    "websockets>=17.0.1",
    "anyio>=4.13.0",
    "textual-dev>=1.8.0",
    "jsonpatch>=1.35",
]

[project.scripts]
brunel = "brunel.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brunel"]

[tool.ruff]
target-version = "py314"
line-length = 88
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
